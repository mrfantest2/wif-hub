name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s gateway -p 'test_*.py' -v
      # GitHub Ubuntu runners already ship Android SDK; setup-android@v3 incorrectly
      # requests removed SDK package 'tools' and fails before the build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon --project-dir android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wif-hub-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
